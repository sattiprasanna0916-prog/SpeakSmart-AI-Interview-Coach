
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    SpeakSmart • Login
  </title>

  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="responsive.css">

  <link rel="icon" href="data:,">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

</head>

<body class="dark">

  <!-- NAVBAR -->
  <header class="topbar glass">

    <nav class="navRight">

      <a
        href="home.html"
        class="btn ghost"
      >
        Home
      </a>

    </nav>

  </header>

  <!-- MAIN -->
  <main class="auth-container">

    <div class="auth-card glass">

      <!-- HEADER -->
      <div class="auth-header">

        <span class="heroTag">
          🚀 AI-Powered Interview Practice
        </span>

        <h1>
          Welcome Back 👋
        </h1>

        <p>

          Practice interviews, improve communication,
          and get AI-powered feedback instantly.

        </p>

      </div>

      <!-- TABS -->
      <div class="auth-tabs">

        <button
          class="tab active"
          onclick="switchTab('register')"
        >
          Register
        </button>

        <button
          class="tab"
          onclick="switchTab('login')"
        >
          Login
        </button>

      </div>

      <!-- REGISTER -->
      <div
        id="registerForm"
        class="auth-form active"
      >

        <label>
          Email Address
        </label>

        <input
          type="email"
          id="regEmail"
          placeholder="you@example.com"
          required
        >

        <label>
          Branch / Domain
        </label>

        <input
          type="text"
          id="regBranch"
          placeholder="CSE / AIML / IT"
          required
        >

        <button
          id="registerBtn"
          class="btn primary full glow"
          onclick="handleRegister()"
        >

          🚀 Create Account

        </button>

      </div>

      <!-- LOGIN -->
      <div
        id="loginForm"
        class="auth-form"
      >

        <label>
          Email Address
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="you@example.com"
          required
        >

        <button
          id="loginBtn"
          class="btn success full glow"
          onclick="handleLogin()"
        >

          🔐 Continue

        </button>

      </div>

      <!-- EXTRA -->
      <div
        style="
          margin-top:28px;
          text-align:center;
          color:#94a3b8;
          line-height:1.7;
          font-size:14px;
        "
      >

        Practice smarter with AI-powered
        interview simulations and
        personalized communication feedback.

      </div>

    </div>

  </main>

  <!-- TAB SWITCH -->
  <script>

    window.addEventListener(
      "DOMContentLoaded",
      () => {

        const token =
          localStorage.getItem("token");

        if (token) {

          window.location.href =
            "home.html";
        }

      }
    );

    function switchTab(type){

      document
        .getElementById("registerForm")
        .classList.remove("active");

      document
        .getElementById("loginForm")
        .classList.remove("active");

      document
        .querySelectorAll(".tab")
        .forEach(
          t => t.classList.remove("active")
        );

      if(type === "register"){

        document
          .getElementById("registerForm")
          .classList.add("active");

        document
          .querySelectorAll(".tab")[0]
          .classList.add("active");

      } else {

        document
          .getElementById("loginForm")
          .classList.add("active");

        document
          .querySelectorAll(".tab")[1]
          .classList.add("active");
      }
    }

  </script>

  <!-- MODULE -->
  <script type="module">

    import {
      registerUser,
      loginUser
    } from "./js/auth.js";

    async function handleRegister(){

      const email =
        document
          .getElementById("regEmail")
          .value.trim();

      const branch =
        document
          .getElementById("regBranch")
          .value.trim();

      const btn =
        document
          .getElementById("registerBtn");

      if(!email || !branch){

        alert(
          "Please fill all fields"
        );

        return;
      }

      btn.innerText =
        "Creating Account...";

      btn.disabled = true;

      try {

        await registerUser(
          email,
          branch
        );

      } catch(err){

        alert(
          "Registration failed"
        );
      }

      btn.innerText =
        "🚀 Create Account";

      btn.disabled = false;
    }

    async function handleLogin(){

      const email =
        document
          .getElementById("loginEmail")
          .value.trim();

      const btn =
        document
          .getElementById("loginBtn");

      if(!email){

        alert(
          "Please enter email"
        );

        return;
      }

      btn.innerText =
        "Logging In...";

      btn.disabled = true;

      try {

        await loginUser(email);

      } catch(err){

        alert(
          "Login failed"
        );
      }

      btn.innerText =
        "🔐 Continue";

      btn.disabled = false;
    }

    window.handleRegister =
      handleRegister;

    window.handleLogin =
      handleLogin;

  </script>

</body>

</html>
```
